# pnpm v11 stores dependency build-script approvals here.
allowBuilds:
  dtrace-provider: true

# archiver still requests minimatch 10 through readdir-glob 3.
overrides:
  "minimatch@>=7 <11.0.1": 11.0.4
  # bestzip still requests glob 13, which cannot safely cancel traversal.
  "bestzip>glob": 14.0.4
